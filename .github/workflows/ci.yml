name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pandoc

      - name: Install Pandoc on macOS
        if: runner.os == 'macOS'
        run: brew install pandoc

      - name: Install Pandoc on Windows
        if: runner.os == 'Windows'
        run: choco install pandoc --no-progress -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test -- --run
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test installed Pandoc integration
        run: cargo test --manifest-path src-tauri/Cargo.toml installed_pandoc_converts_rich_fixture_to_docx_and_epub -- --ignored

  native-workbench-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            os: macos
          - platform: ubuntu-24.04
            os: linux
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            patchelf \
            build-essential \
            openbox \
            xdotool \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-driver
        if: matrix.os == 'linux'
        run: cargo install tauri-driver --locked

      - run: npm ci

      - name: Build native Workbench smoke app
        env:
          VITE_WDIO: "1"
          VITE_NATIVE_DOCKING: "1"
        run: npm run tauri -- build --debug --no-bundle --features webdriver --config src-tauri/tauri.smoke.conf.json

      - name: Verify actual-pointer Workbench docking
        if: matrix.os != 'linux'
        run: npm run test:e2e:workbench

      - name: Verify Linux native pointer boundary
        if: matrix.os == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a sh -c 'openbox >"${RUNNER_TEMP}/rune-openbox.log" 2>&1 & npm run test:e2e:native-drag:linux'

      - name: Record hosted Linux cross-window limitation
        if: matrix.os == 'linux'
        run: |
          echo "::notice title=Linux cross-window pointer evidence::Hosted Xvfb/Openbox plus tauri-driver reparents the detached WebKit input window separately from its native frame. Exact-target cross-window pointer evidence remains a manual Linux desktop release gate."
          echo "### Linux cross-window pointer evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted Xvfb/Openbox verifies the real native pointer boundary only. Exact-target re-docking remains an explicit manual Linux desktop release gate because tauri-driver reparents the WebKit input window separately from its native frame." >> "$GITHUB_STEP_SUMMARY"
